  <!-- Recrutamento Section -->
  <section id="recrutamento">
    <h2>Faça Parte da Nossa Equipe</h2>
    <p>Estamos sempre em busca de novos talentos. Se você é um designer criativo, inscreva-se para fazer parte da nossa equipe!</p>
    <form action="https://formspree.io/f/xgvkaere" method="POST">
      <label for="name">Nome:</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Mensagem:</label>
      <textarea id="message" name="message" required></textarea>

      <button type="submit" class="cta-btn">Enviar Candidatura</button>
    </form>
  </section>
