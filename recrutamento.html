  <!-- Recrutamento Section -->
  <section id="recrutamento">
    <h2>Faça parte da nossa equipe!</h2>
    <p>Estamos sempre em busca de novos talentos para agregar à nossa equipe criativa.</p>

    <form action="https://formspree.io/f/xgvkaere" method="POST" class="recrutamento-form">
      <input type="text" name="nome" placeholder="Seu nome" required>
      <input type="email" name="email" placeholder="Seu e-mail" required>
      <textarea name="mensagem" rows="5" placeholder="Por que você quer trabalhar conosco?" required></textarea>
      <button type="submit" class="cta-btn">Enviar</button>
    </form>
  </section>
